# Builds the release packages on a version tag (v3.0.0) or on demand.
# The Python sidecar is built with PyInstaller, which cannot cross-compile,
# so every platform builds on its own runner.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the Linux binaries compatible with older glibc and the core22 snap.
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modern/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: modern/src-tauri
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - name: Python environment
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then py=.venv/Scripts/python.exe; else py=.venv/bin/python; fi
          "$py" -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then py=.venv/Scripts/python.exe; else py=.venv/bin/python; fi
          "$py" -m unittest discover -s tests
      - name: Frontend dependencies
        working-directory: modern
        run: npm ci
      - name: Backend sidecar
        working-directory: modern
        run: npm run bundle:backend
      - name: Desktop bundles
        working-directory: modern
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ runner.os }}
          path: |
            modern/src-tauri/target/release/bundle/deb/*.deb
            modern/src-tauri/target/release/bundle/appimage/*.AppImage
            modern/src-tauri/target/release/bundle/nsis/*.exe

  snap:
    needs: desktop
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bundles-Linux
          path: modern/src-tauri/target/release/bundle
      - uses: snapcore/action-build@v1
        id: snap
      - uses: actions/upload-artifact@v4
        with:
          name: snap
          path: ${{ steps.snap.outputs.snap }}
      # Publish tagged builds to the edge channel; promote to stable from the
      # Snap Store dashboard after testing. Needs the SNAPCRAFT_STORE_CREDENTIALS
      # secret (snapcraft export-login --snaps=gestimator
      # --acls package_access,package_push,package_update,package_release -).
      - uses: snapcore/action-publish@v1
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snap.outputs.snap }}
          release: edge

  flatpak:
    # Same build as Flathub (from source, offline), using this checkout.
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Local manifest
        run: packaging/flathub/build-local.sh --manifest-only
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: gestimator.flatpak
          manifest-path: packaging/flathub/local.json

  release:
    needs: [desktop, snap, flatpak]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/**/*.deb
            dist/**/*.AppImage
            dist/**/*.exe
            dist/**/*.snap
            dist/**/*.flatpak
