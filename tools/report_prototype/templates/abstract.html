<h1>Abstract of estimate</h1>
<p>{{ project }}</p>
<table>
  <thead>
    <tr>
      <th>Category</th>
      <th>Amount</th>
    </tr>
  </thead>
  <tbody>
    {% for row in abstract %}
    <tr>
      <td>{{ row.category }}</td>
      <td class="number">{{ row.amount }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
<p class="total">Estimate total: {{ total }}</p>
<p>Summary of the selected schedule items. No additional tax or contingency is applied.</p>
