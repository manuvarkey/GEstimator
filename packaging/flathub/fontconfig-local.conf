<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Installed as /app/etc/fonts/local.conf, which the runtime's 50-flatpak.conf includes.
     Inside the sandbox, host WOFF fonts (e.g. Debian/Ubuntu fonts-ebgaramond-extra in
     /usr/share/fonts/woff) can come through without a family name. WebKitGTK's Skia font
     manager (SkFontMgr_fontconfig::GetFamilyNames) loops forever on such a pattern, so the
     web process hangs before the first paint and the window never shows. Web content loads
     WOFF files itself, so desktop fontconfig does not need them. -->
<fontconfig>
  <selectfont>
    <rejectfont>
      <glob>*.woff</glob>
      <glob>*.woff2</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
