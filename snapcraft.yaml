name: gestimator
title: GEstimator
version: '3.0.0'
summary: Cost estimates with rate analysis for civil and electrical works
description: |
  GEstimator prepares cost and quantity estimates of civil and electrical works with detailed rate analysis. It comes with DSR 2021 (Civil) and DSR (E&M) 2025 and can use other databases of items.

  Schedule items, resources and details of measurements are edited in tables. The rate analysis editor supports undo, bulk editing of analyses and rate updates from databases. Estimates import from and export to Excel workbooks. An optional local MCP server lets AI assistants read and prepare estimates.
license: GPL-3.0-or-later
icon: packaging/linux/icons/hicolor/scalable/apps/com.kavilgroup.gestimator.svg
grade: stable
base: core22
confinement: strict
# The .deb must be built on Ubuntu 22.04 (the glibc of core22); see .github/workflows/release.yml.
architectures:
  - build-on: amd64

apps:
  gestimator:
    command: usr/bin/gestimator
    desktop: usr/share/applications/com.kavilgroup.gestimator.desktop
    extensions: [gnome]
    common-id: com.kavilgroup.gestimator
    plugs:
      - home
      - removable-media
      # Local MCP server for AI assistants on the same machine.
      - network
      - network-bind
    slots:
      - single-instance

slots:
  # A second launch hands its files to the running window over this D-Bus name
  # (tauri-plugin-single-instance: "<identifier>.SingleInstance").
  single-instance:
    interface: dbus
    bus: session
    name: com.kavilgroup.gestimator.SingleInstance

parts:
  gestimator:
    plugin: dump
    source: modern/src-tauri/target/release/bundle/deb/GEstimator_3.0.0_amd64.deb
    source-type: deb
    stage-packages:
      - libwebkit2gtk-4.1-0
    override-build: |
      craftctl default
      install -Dm644 "$CRAFT_PROJECT_DIR/packaging/linux/applications/com.kavilgroup.gestimator.desktop" \
        "$CRAFT_PART_INSTALL/usr/share/applications/com.kavilgroup.gestimator.desktop"
      sed -i 's|^Icon=.*|Icon=${SNAP}/meta/gui/icon.svg|' \
        "$CRAFT_PART_INSTALL/usr/share/applications/com.kavilgroup.gestimator.desktop"
      rm -f "$CRAFT_PART_INSTALL/usr/share/applications/GEstimator.desktop"
