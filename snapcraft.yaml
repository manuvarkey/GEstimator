name: gestimator
title: GEstimator
version: '3.1.0'
summary: Cost estimates with rate analysis for civil and electrical works
description: |
  GEstimator prepares cost and quantity estimates of civil and electrical works with detailed rate analysis. It comes with DSR 2023 (Civil), DSR (E&M) 2025 and DSR 2025 (Horticulture and Landscaping), and it can use your own item databases.

  Schedule items, resources and details of measurements are edited in tables. The rate analysis editor supports undo, bulk editing of analyses and rate updates from databases. Estimates import from and export to Excel workbooks. An optional local MCP server gives AI assistants access to bundled and user-added estimation guides.
license: GPL-3.0-or-later
icon: packaging/linux/icons/hicolor/scalable/apps/com.kavilgroup.gestimator.svg
grade: stable
base: core22
confinement: strict
# The .deb must be built on Ubuntu 22.04 (the glibc of core22); see .github/workflows/release.yml.
architectures:
  - build-on: amd64

apps:
  gestimator:
    command: usr/bin/gestimator
    desktop: usr/share/applications/com.kavilgroup.gestimator.desktop
    extensions: [gnome]
    common-id: com.kavilgroup.gestimator
    plugs:
      - home
      - removable-media
      # Local MCP server for AI assistants on the same machine.
      - network
      - network-bind
# No D-Bus slot for tauri-plugin-single-instance ("<identifier>.SingleInstance"):
# a dbus slot needs a Snap Store declaration (manual review). Without it the
# plugin cannot own the name and each launch opens its own window.

parts:
  gestimator:
    plugin: dump
    source: modern/src-tauri/target/release/bundle/deb/GEstimator_3.1.0_amd64.deb
    source-type: deb
    # No stage-packages: the gnome extension's gnome-42-2204 runtime already
    # ships libwebkit2gtk-4.1. Staging it from the 22.04 archive also pulled in
    # Mesa 22 (libEGL_mesa, dri drivers), which shadowed the runtime's newer
    # Mesa and failed at start with "libEGL fatal: did not find extension
    # DRI_Mesa version 1".
    override-build: |
      craftctl default
      install -Dm644 "$CRAFT_PROJECT_DIR/packaging/linux/applications/com.kavilgroup.gestimator.desktop" \
        "$CRAFT_PART_INSTALL/usr/share/applications/com.kavilgroup.gestimator.desktop"
      sed -i 's|^Icon=.*|Icon=${SNAP}/meta/gui/icon.svg|' \
        "$CRAFT_PART_INSTALL/usr/share/applications/com.kavilgroup.gestimator.desktop"
      rm -f "$CRAFT_PART_INSTALL/usr/share/applications/GEstimator.desktop"
